version: '3.8'

services:
  backend:
    build: .
    # This service can still be reached on port 9000 directly from the host.
    # The conflicting "8080:8080" mapping is removed. Your app still runs on 8080 INSIDE the container.
    ports:
      - "9000:9000"
    volumes:
      - ./money_tracker.db:/app/money_tracker.db
    env_file:
      - .env
    labels:
      # --- Traefik Labels ---
      - "traefik.enable=true"
      # ⭐️ IMPORTANT: This label tells Traefik to send traffic to this container's internal port 8080.
      # Using unique service name "money-backend" to avoid conflicts with other services
      - "traefik.http.services.money-backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.money-backend.rule=Host(`money.ensa-ai.com`)"
      - "traefik.http.routers.money-backend.entrypoints=websecure"
      - "traefik.http.routers.money-backend.tls.certresolver=myresolver"
    networks:
      - traefik-network
    restart: unless-stopped

networks:
  traefik-network:
    external: true
    name: traefik-network

  # ⚠️ NOTE: Traefik is NOT included here
  # 
  # ✅ Use the separate traefik-compose.yaml file to start Traefik:
  # docker-compose -f traefik-compose.yaml up -d
  #
  # The shared Traefik instance handles routing for both domains:
  # - money.ensa-ai.com -> ai-money-tracker backend (container port 8080)
  # - ensa-ai.com -> ensa-ai backend (container port 3000)